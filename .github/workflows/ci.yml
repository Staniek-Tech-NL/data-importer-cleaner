name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx --collect "XPlat Code Coverage" --results-directory artifacts/test-results

      - name: Enforce coverage baseline
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-Coverage.ps1 -CoverageRoot artifacts/test-results

      - name: Validate documentation
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-Documentation.ps1

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/**
          if-no-files-found: warn
