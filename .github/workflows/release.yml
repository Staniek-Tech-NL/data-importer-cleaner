name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require a license
        shell: pwsh
        run: |
          $license = Get-ChildItem -Path . -File | Where-Object { $_.Name -match '^LICENSE(?:\.|$)' }
          if (-not $license) {
            throw 'A LICENSE file is required before publishing a release.'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore DataCleaner.slnx
          dotnet restore src/DataCleaner.App/DataCleaner.App.csproj --runtime win-x64

      - name: Build
        run: dotnet build DataCleaner.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DataCleaner.slnx --configuration Release --no-build --no-restore

      - name: Publish Windows application
        run: >-
          dotnet publish src/DataCleaner.App/DataCleaner.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/DataImporterCleaner-${{ github.ref_name }}-win-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataImporterCleaner-${{ github.ref_name }}-win-x64
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem -Path artifacts -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) {
            throw 'Release archive was not created.'
          }

          gh release create "${{ github.ref_name }}" $archive.FullName `
            --draft `
            --generate-notes `
            --title "${{ github.ref_name }}"
