name: Bug report
description: Report a reproducible problem using synthetic data.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not attach customer data, credentials, personal information or sensitive logs.
  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Release number, commit hash or branch name.
      placeholder: v0.1.0 or commit abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, architecture and .NET SDK when relevant.
      placeholder: Windows 11 24H2, x64, .NET SDK 10.0.400
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence and use synthetic sample data only.
      placeholder: |
        1. Start the application
        2. Import the attached synthetic CSV
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized screenshots or logs if they help. Remove personal and business data first.
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I confirm that this report contains no real customer data, credentials, personal data or confidential files.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
