name: Feature proposal
description: Propose a scoped improvement tied to a business problem.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Business problem
      description: Describe the user problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable result would solve the problem?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Import and preview
        - Profiling and mapping
        - Validation
        - Cleaning
        - Deduplication
        - Review and export
        - Profiles and history
        - User interface
        - Documentation and developer experience
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or simpler approaches.
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      description: List observable conditions that would make the proposal complete.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I reviewed the documented MVP scope and roadmap.
          required: true
        - label: I understand that out-of-scope ideas may be deferred beyond v1.0.
          required: true
