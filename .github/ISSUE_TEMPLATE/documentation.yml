name: Documentation improvement
description: Report missing, incorrect or unclear documentation.
title: "docs: "
body:
  - type: input
    id: location
    attributes:
      label: Document or location
      placeholder: README.md, docs/development.md, or a URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks setup or use
        - Could cause incorrect behavior
        - Creates confusion
        - Minor wording or formatting issue
    validations:
      required: true
